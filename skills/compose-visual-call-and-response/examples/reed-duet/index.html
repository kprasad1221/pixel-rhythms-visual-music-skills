<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reed Duet · Pixel Rhythms</title>
  <style>
    :root { color-scheme: dark; font: 100%/1.5 "Inter", "Segoe UI", sans-serif; background: #081b20; color: #f4f2e8; }
    * { box-sizing: border-box; }
    body { margin: auto; max-width: 60rem; padding: clamp(1rem, 5vw, 4rem); }
    h1 { font: normal clamp(2.8rem, 8vw, 5.4rem)/1.1 "Baskervville", Georgia, serif; margin: 0 0 .25em; letter-spacing: -.04em; }
    p { color: #c3d9d4; max-width: 60ch; }
    canvas { width: 100%; height: auto; display: block; border-radius: .75rem; background: #102d34; }
    .controls { display: flex; flex-wrap: wrap; gap: 1rem; align-items: end; margin: 1.25rem 0 .8rem; }
    label { display: grid; gap: .25rem; font-size: .88rem; }
    button, select { min-height: 2.75rem; font: inherit; border: 1px solid #59756e; border-radius: .4rem; padding: .45rem .9rem; }
    select { background: #122c32; color: #f3efe4; }
    button { background: #efe2b9; color: #132c2b; min-width: 5rem; cursor: pointer; }
    input { width: 100%; min-height: 2rem; accent-color: #e6c576; }
    output { font-variant-numeric: tabular-nums; }
    :focus-visible { outline: 3px solid #ffda77; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Reed Duet</h1>
    <p>Follow the reeds across the water. A beat later, a trail of seeds lifts in the opposite direction.</p>
    <canvas width="960" height="380" role="img" aria-label="A turquoise reed bank bends from left to right while golden seeds lift from right to left."></canvas>
    <div class="controls">
      <button id="play" type="button">Play</button>
      <label>Visual phrase
        <select id="mode">
          <option value="all">Every reply</option>
          <option value="rest">Leave a rest</option>
          <option value="solo">Call only</option>
        </select>
      </label>
    </div>
    <label for="position">Playhead <output id="time" for="position">0.00 / 8.00 s</output></label>
    <input id="position" type="range" min="0" max="8" step="0.01" value="0">
    <p>Try <strong>Leave a rest</strong> during the second bar. The soundtrack stays the same. Listen through the next entrance, or pause and scrub to compare a single moment.</p>
    <p id="status" role="status"></p>
  </main>
  <script type="module" src="player.mjs"></script>
</body>
</html>
